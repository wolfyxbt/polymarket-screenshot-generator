<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polymarket Screenshot Generator · Polymarket 截图生成器</title>
<meta name="description" content="粘贴 Polymarket 市场链接，生成一张线尾直接标注选项和概率的走势图 PNG。纯静态网页，非官方工具。">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316191D'/%3E%3Cpath d='M6 22l6-7 5 4 9-10' fill='none' stroke='%2387BFFF' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='26' cy='9' r='3' fill='%2387BFFF'/%3E%3C/svg%3E">
<style>
  /* 这里只管工具自己的界面；生成的图在下面的 buildSVG 里，两边互不影响 */
  :root {
    --bg:#F4F5F7; --surface:#FFFFFF; --fill:#EEF0F3; --seg-on:#FFFFFF;
    --ink:#16191D; --ink2:#4A515C; --mute:#7B838F; --line:#E4E7EB; --line2:#D3D8DE;
    --accent:#16191D; --on-accent:#FFFFFF; --focus:#2F6BFF; --ok:#12833B;
    --err:#B42318; --err-bg:#FDEEEC; --err-line:#F6C9C4;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.07);
    --r:10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0F1114; --surface:#181B20; --fill:#23272E; --seg-on:#3A404A;
      --ink:#ECEEF1; --ink2:#B4BAC4; --mute:#858D99; --line:#2A2F37; --line2:#3B414B;
      --accent:#ECEEF1; --on-accent:#16191D; --focus:#6C96FF; --ok:#2F9E62;
      --err:#FF9288; --err-bg:#34191A; --err-line:#5E2A27;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
         font:14px/1.45 PMInter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  [hidden] { display:none !important; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }

  /* 顶栏：名字、链接输入、源码 */
  .top { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:16px; height:64px; padding:0 24px;
         background:color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter:saturate(1.4) blur(12px);
         -webkit-backdrop-filter:saturate(1.4) blur(12px); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; flex:none; color:inherit; text-decoration:none;
           font-weight:650; font-size:15px; white-space:nowrap; }
  .brand svg { width:28px; height:28px; flex:none; }
  .brand em { font-style:normal; font-weight:500; font-size:11px; color:var(--mute);
              border:1px solid var(--line2); border-radius:999px; padding:1px 7px; }
  .linkbar { flex:1; display:flex; gap:8px; max-width:760px; min-width:0; margin:0 auto; }
  .linkfield { position:relative; flex:1; min-width:0; }
  .linkfield svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px;
                   color:var(--mute); pointer-events:none; }
  #link { width:100%; height:40px; padding:0 38px 0 36px; border:1px solid var(--line2); border-radius:var(--r);
          background:var(--surface); outline:none; text-overflow:ellipsis; }
  #link::placeholder, .field input::placeholder { color:var(--mute); }
  #link:focus, .field input:focus { border-color:var(--focus); box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
  #clear { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:28px; height:28px; border:0;
           border-radius:7px; background:none; color:var(--mute); font-size:18px; line-height:1; }
  #clear:hover { background:var(--fill); color:var(--ink); }
  .gh { flex:none; display:grid; place-items:center; width:36px; height:36px; border-radius:9px; color:var(--ink2); }
  .gh:hover { background:var(--fill); color:var(--ink); }
  .gh svg { width:20px; height:20px; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; height:40px; padding:0 16px;
         border:1px solid var(--line2); border-radius:var(--r); background:var(--surface); font-weight:600;
         white-space:nowrap; transition:background .12s, transform .06s; }
  .btn:hover { background:var(--fill); }
  .btn:active { transform:translateY(1px); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .btn.primary:hover { background:color-mix(in srgb, var(--accent) 84%, var(--surface)); }
  .btn:disabled { opacity:.45; cursor:default; transform:none; }
  .btn svg { width:16px; height:16px; flex:none; }
  #go { min-width:84px; }

  /* 主体：左边设置，右边预览 */
  .shell { display:grid; grid-template-columns:312px minmax(0, 1fr); gap:24px; align-items:start;
           max-width:1346px; margin:0 auto; padding:20px 24px 32px; }
  .side { position:sticky; top:80px; display:grid; gap:12px; max-height:calc(100vh - 92px); overflow:auto;
          scrollbar-width:thin; }
  .panel { display:grid; gap:16px; padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:14px; }
  .panel h2 { margin:0 0 8px; font-size:12px; font-weight:600; color:var(--mute); letter-spacing:.02em; }
  .headrow { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .textlink { border:0; background:none; padding:0; font-size:12px; color:var(--mute); text-decoration:underline; text-underline-offset:2px; }
  .textlink:hover { color:var(--ink); }
  .hint { margin:6px 0 0; font-size:12px; color:var(--mute); line-height:1.5; }

  .seg { display:flex; gap:2px; padding:3px; background:var(--fill); border-radius:9px; }
  .seg button { flex:1; min-width:0; height:30px; padding:0 2px; border:0; border-radius:7px; background:none;
                color:var(--ink2); font-size:13px; font-weight:500; white-space:nowrap; }
  .seg button:hover { color:var(--ink); }
  .seg button[aria-pressed="true"] { background:var(--seg-on); color:var(--ink); font-weight:600;
                                     box-shadow:0 1px 2px rgba(16,24,40,.14), 0 0 0 .5px var(--line2); }

  .switch { display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer; }
  .switch b { display:block; font-size:13px; font-weight:600; }
  .switch small { display:block; margin-top:2px; font-size:12px; color:var(--mute); }
  .switch input { position:absolute; opacity:0; width:1px; height:1px; }
  .switch i { position:relative; flex:none; width:38px; height:22px; border-radius:999px; background:var(--line2); transition:background .15s; }
  .switch i::after { content:""; position:absolute; left:2px; top:2px; width:18px; height:18px; border-radius:50%;
                     background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.28); transition:transform .15s; }
  .switch input:checked + i { background:var(--ok); }
  .switch input:checked + i::after { transform:translateX(16px); }
  .switch input:focus-visible + i { outline:2px solid var(--focus); outline-offset:2px; }

  .texts { display:grid; gap:8px; }
  .field { display:grid; grid-template-columns:56px minmax(0, 1fr); align-items:center; gap:8px; }
  .field > span { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--mute); white-space:nowrap; }
  .field > span i { width:8px; height:8px; border-radius:50%; flex:none; }
  .field input { width:100%; height:34px; padding:0 10px; border:1px solid var(--line2); border-radius:8px;
                 background:var(--surface); outline:none; }

  .recent { display:grid; gap:2px; margin:0 -8px -6px; }
  .recent button { display:block; width:100%; padding:7px 8px; border:0; border-radius:7px; background:none; text-align:left;
                   font-size:13px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .recent button:hover { background:var(--fill); color:var(--ink); }

  main { min-width:0; }
  .wrap { max-width:962px; margin:0 auto; }
  .actions { display:flex; align-items:center; gap:10px; min-height:40px; margin-bottom:12px; }
  .grow { flex:1; }
  #msg { display:flex; align-items:center; gap:8px; min-width:0; font-size:13px; color:var(--ink2); }
  #msg:not(:empty)::before { content:""; flex:none; width:7px; height:7px; border-radius:50%; background:var(--ok); }
  body.busy #msg::before { background:var(--mute); animation:pulse 1s ease-in-out infinite; }
  #dims { font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums; white-space:nowrap; }
  #err { margin-bottom:12px; padding:10px 14px; border:1px solid var(--err-line); border-radius:var(--r);
         background:var(--err-bg); color:var(--err); font-size:13px; }

  .stage { position:relative; }
  .shot { background:#fff; border:1px solid var(--line); border-radius:6px; overflow:hidden; box-shadow:var(--shadow); transition:opacity .15s; }
  .shot svg { display:block; width:100%; height:auto; }
  .stage.busy .shot, .stage.busy .empty { opacity:.45; }
  .stage.busy::after { content:""; position:absolute; left:50%; top:96px; width:28px; height:28px; margin-left:-14px;
                       border:3px solid var(--line2); border-top-color:var(--ink); border-radius:50%; animation:spin .7s linear infinite; }

  .empty { padding:44px 28px 28px; text-align:center; background:var(--surface); border:1px dashed var(--line2);
           border-radius:14px; transition:opacity .15s; }
  .empty h1 { margin:0 0 8px; font-size:22px; font-weight:650; letter-spacing:-.01em; }
  .empty p { max-width:460px; margin:0 auto 18px; color:var(--ink2); }
  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:28px; }
  .chips button { height:32px; padding:0 13px; border:1px solid var(--line2); border-radius:999px; background:var(--surface);
                  font-size:13px; color:var(--ink2); }
  .chips button:hover { background:var(--fill); color:var(--ink); }
  .sample { position:relative; max-width:640px; margin:0 auto; border:1px solid var(--line); border-radius:6px;
            box-shadow:var(--shadow); background:#fff; }
  .sample img { display:block; width:100%; height:auto; border-radius:5px; }
  .sample span { position:absolute; left:50%; top:-11px; transform:translateX(-50%); padding:2px 10px; border-radius:999px;
                 background:var(--ink); color:var(--surface); font-size:11px; font-weight:600; white-space:nowrap; }

  footer { padding:0 24px 40px; color:var(--mute); font-size:12px; line-height:1.7; text-align:center; }
  footer a { color:inherit; }

  #toast { position:fixed; left:50%; bottom:28px; z-index:9; max-width:min(560px, calc(100vw - 32px)); padding:10px 16px;
           border-radius:12px; background:#16191D; color:#fff; font-size:13px; box-shadow:0 8px 28px rgba(0,0,0,.28);
           opacity:0; transform:translate(-50%, 12px); pointer-events:none; transition:opacity .18s, transform .18s; }
  #toast.on { opacity:1; transform:translate(-50%, 0); }
  #toast.bad { background:#B42318; }

  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulse { 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

  /* 窄屏：设置在上，预览居中，改文字和最近生成排到预览下面 */
  @media (max-width:1100px) {
    .shell { display:flex; flex-direction:column; align-items:stretch; gap:16px; padding:16px 16px 28px; }
    .side { display:contents; }
    .side > *, main { width:100%; max-width:962px; margin:0 auto; }
    .side > .a { order:1; } main { order:2; } .side > .b { order:3; } .side > .c { order:4; }
  }
  @media (min-width:641px) and (max-width:1100px) {
    .panel.a { grid-template-columns:1fr 1fr; gap:16px 24px; }
    .texts { grid-template-columns:1fr 1fr; }
  }
  @media (max-width:640px) {
    .top { gap:10px; padding:0 12px; }
    .brand span, .brand em, .gh { display:none; }
    .actions { flex-wrap:wrap; }
    .actions .grow { display:none; }
    #msg { flex:1 0 100%; }
    #dims { display:none; }
    .actions .btn { flex:1; }
    .empty { padding:32px 16px 16px; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="Polymarket 截图生成器">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#16191D"/><path d="M6 22l6-7 5 4 9-10" fill="none" stroke="#87BFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26" cy="9" r="3" fill="#87BFFF"/></svg>
    <span>Polymarket 截图生成器</span><em>非官方</em>
  </a>
  <form id="form" class="linkbar">
    <div class="linkfield">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6.7 9.3a3 3 0 0 0 4.2 0l2.2-2.2a3 3 0 0 0-4.2-4.2l-.8.8M9.3 6.7a3 3 0 0 0-4.2 0L2.9 8.9a3 3 0 0 0 4.2 4.2l.8-.8"/></svg>
      <input type="text" id="link" autocomplete="off" spellcheck="false" aria-label="Polymarket 市场链接"
             placeholder="粘贴 Polymarket 市场链接，例如 https://polymarket.com/event/next-ceo-of-nvidia">
      <button type="button" id="clear" aria-label="清空链接" hidden>×</button>
    </div>
    <button class="btn primary" id="go">生成</button>
  </form>
  <a class="gh" href="https://github.com/wolfyxbt/polymarket-screenshot-generator" target="_blank" rel="noopener" aria-label="GitHub 源码">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
  </a>
</header>

<div class="shell">
  <aside class="side" aria-label="设置">
    <div class="panel a">
      <section>
        <h2 id="h-interval">时间范围</h2>
        <div class="seg" id="interval" role="group" aria-labelledby="h-interval"></div>
      </section>
      <section>
        <h2 id="h-top">选项数</h2>
        <div class="seg" id="top" role="group" aria-labelledby="h-top"></div>
        <p class="hint">按当前概率从高到低，画前几个选项。</p>
      </section>
      <section>
        <h2 id="h-lang">图片语言</h2>
        <div class="seg" id="lang" role="group" aria-labelledby="h-lang"></div>
      </section>
      <section>
        <label class="switch">
          <span><b>选项列表</b><small>走势图下面带上每个选项的买入价</small></span>
          <input type="checkbox" id="rows" checked><i></i>
        </label>
      </section>
    </div>
    <div class="panel b">
      <section>
        <div class="headrow"><h2>修改文字</h2><button type="button" class="textlink" id="reset" hidden>恢复默认</button></div>
        <div class="texts" id="texts"></div>

    <div class="panel c" id="recentBox" hidden>
      <section>

        <div class="recent" id="recent"></div>
      </section>
    </div>
  </aside>

  <main>
    <div class="wrap">
      <div class="actions">
        <div id="msg" role="status" aria-live="polite"></div>
        <span class="grow"></span>
        <span id="dims"></span>
        <button class="btn" id="save" disabled>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v8M4.8 7.4 8 10.6l3.2-3.2M3 13.5h10"/></svg>

          <span>复制图片</span>

      </div>
      <div id="err" role="alert" hidden></div>
      <div id="stage" class="stage">
        <div class="empty">
          <h1>粘贴一个 Polymarket 市场链接</h1>
          <p>生成一张线尾直接标着选项和概率的走势图，复制后可以直接贴进推文。</p>
          <div class="chips">
            <button type="button" data-link="https://polymarket.com/event/next-ceo-of-nvidia">试试：多选项市场</button>
            <button type="button" data-link="https://polymarket.com/event/new-nvidia-ceo-named-by-december-31-2026">试试：是 / 否市场</button>

        </div>
      </div>
    </div>
  </main>
</div>
<footer>
  非官方工具，与 Polymarket 没有关联；数据来自 Polymarket 的公开接口，商标和图标归 Polymarket 所有。<br>

<script>
const GAMMA = 'https://gamma-api.polymarket.com', CLOB = 'https://clob.polymarket.com';
// 时间范围 -> 每个点的间隔（分钟），从细到粗依次尝试
const FIDELITY = { '1h': [1], '6h': [1, 5], '1d': [5, 10], '1w': [30, 60], '1m': [180, 360], 'max': [720, 1440] };
const TABS = ['1h', '6h', '1d', '1w', '1m', 'max'];
// Polymarket 多选项走势图按名次用的四个线色；后面几个是选项超过 4 个时的补充
const COLORS = ['#87BFFF', '#4378FF', '#FDC503', '#FF7F0E', '#27AE60', '#9B51E0', '#EB5757', '#56CCF2'];
const TEXT = {
  zh: { vol: '交易量', yes: '买入 是', no: '买入 否', src: '来源：', tabs: ['1小时', '6小时', '1天', '1周', '1个月', '全部'] },

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const jlist = v => { if (typeof v !== 'string') return v || []; try { return JSON.parse(v); } catch { return []; } };
const num = v => (v === null || v === undefined || v === '') ? null : +v;
// 百分比逢五进一（和 Polymarket 一致）
const pct = (v, d = 0) => (Math.round(v * 100 * 10 ** d + 1e-7) / 10 ** d).toFixed(d) + '%';
const cents = p => String(+(Math.round(p * 1000 + 1e-7) / 10).toFixed(1)) + '¢';
const money = v => '$' + Math.round(+v).toLocaleString('en-US');
const lum = hex => {  // 相对亮度，用来决定色块上的字用深色还是白色
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(x => x <= .03928 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4);
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
};

// ───────────────────────── 取数 ─────────────────────────
async function getJSON(url) {
  let r;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);   // 连不上时别一直转圈
  try { r = await fetch(url, { signal: ctl.signal }); }
  catch { throw new Error('连不上 Polymarket 的接口（15 秒内没有回应）。请确认这个浏览器能打开 polymarket.com。'); }
  finally { clearTimeout(timer); }
  if (!r.ok) throw new Error(`Polymarket 接口返回 ${r.status}`);
  return r.json();
}

function parseSlug(link) {
  link = link.trim();
  if (!link.includes('/')) return [link, null];
  let path = link;
  try { path = new URL(link.startsWith('http') ? link : 'https://' + link).pathname; } catch {}
  let m = path.match(/\/event\/([^/?#]+)(?:\/([^/?#]+))?/);
  if (m) return [m[1], m[2] || null];
  m = path.match(/\/market\/([^/?#]+)/);
  if (m) return [null, m[1]];
  throw new Error('看不懂这个链接，需要形如 https://polymarket.com/event/… 的链接。');
}

async function fetchEvent(slug, marketSlug, lang) {
  const loc = lang === 'zh' ? '&locale=zh' : '';   // 带上这个参数，接口直接返回中文标题和选项名
  if (slug) {
    const r = await getJSON(`${GAMMA}/events?slug=${encodeURIComponent(slug)}${loc}`);
    if (r.length) return r[0];
    marketSlug = marketSlug || slug;
  }
  const r = await getJSON(`${GAMMA}/markets?slug=${encodeURIComponent(marketSlug)}${loc}`);
  if (!r.length) throw new Error('Polymarket 上找不到这个市场，检查一下链接。');
  const m = r[0], ev = (m.events || [{}])[0];
  return { title: ev.title || m.question, markets: [m], volume: m.volume, endDate: m.endDate, image: m.image, tags: ev.tags || [] };
}

function buildLines(event, onlyMarket) {
  let ms = (event.markets || []).filter(m => !m.closed && m.active !== false && !m.archived);
  if (!ms.length) ms = event.markets || [];           // 已结算的事件照样画
  if (onlyMarket) { const f = ms.filter(m => m.slug === onlyMarket); if (f.length) ms = f; }
  if (ms.length === 1) {
    // 单个市场：是/否只画"是"；两队对阵这类则两个结果各画一条
    const m = ms[0], outs = jlist(m.outcomes), toks = jlist(m.clobTokenIds), prices = jlist(m.outcomePrices);
    let lines = outs.map((o, i) => ({ key: toks[i], name: o, token: toks[i], price: +prices[i] || 0, logo: null }));
    if (outs.length === 2 && /^(yes|是)$/i.test(outs[0])) lines = lines.slice(0, 1);
    return { lines, single: true };
  }
  const lines = ms.filter(m => jlist(m.clobTokenIds).length).map(m => ({
    key: m.slug || m.id, name: m.groupItemTitle || m.question, token: jlist(m.clobTokenIds)[0],
    price: +jlist(m.outcomePrices)[0] || 0, logo: m.image || m.icon, volume: num(m.volume),
    bestBid: num(m.bestBid), bestAsk: num(m.bestAsk),
  }));
  lines.sort((a, b) => b.price - a.price);
  return { lines, single: false };
}

async function fetchHistory(token, interval) {
  for (const fid of FIDELITY[interval]) {
    const r = await getJSON(`${CLOB}/prices-history?market=${token}&interval=${interval}&fidelity=${fid}`);
    if ((r.history || []).length >= 2) return r.history;
  }
  return [];
}

// 头像要转成 data URL 才能导出成 PNG。Polymarket 的图片不允许网页直接读取，所以读不到时走 wsrv.nl 图片代理。
const imgCache = new Map();
const blobToData = b => new Promise((ok, no) => { const f = new FileReader(); f.onload = () => ok(f.result); f.onerror = no; f.readAsDataURL(b); });
async function inlineImage(url) {
  if (!url || imgCache.has(url)) return;
  imgCache.set(url, null);
  for (const u of [url, `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=160&h=160&fit=cover`]) {
    try {
      const r = await fetch(u);
      if (r.ok) { imgCache.set(url, await blobToData(await r.blob())); return; }
    } catch {}
  }
}

// ───────────────────────── 画图 ─────────────────────────
// 下面的尺寸、字号、字重、颜色都是从 polymarket.com 的市场页上量出来的（CSS 像素），不要凭感觉改
const INK = '#23272d', GREY = '#6b727b', RULE = '#e6e8ec', WM = '#d4d7dc';
const FONT = 'PMInter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';   // Polymarket 用的是 Inter
const FEAT = '"calt","cv01","cv02","cv03","cv04","cv09" 0,"cv11","cv15","liga"';              // 以及这组替代字形
const X0 = 20, CW = 922, W = X0 * 2 + CW, T0 = 20;   // 左右留白、内容宽度、顶部留白
const twCache = new Map();
let twNode = null;
function tw(t, size, weight = 400, ls = 0) {   // 用隐藏的 SVG 文字节点量宽度，替代字形和字距都算进去
  const key = `${t}|${size}|${weight}|${ls}`;
  if (twCache.has(key)) return twCache.get(key);
  if (!twNode) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('style', `position:absolute;left:-9999px;top:0;width:10px;height:10px;font-family:${FONT};font-feature-settings:${FEAT}`);
    twNode = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    svg.append(twNode); document.body.append(svg);
  }
  twNode.setAttribute('font-size', size); twNode.setAttribute('font-weight', weight); twNode.setAttribute('letter-spacing', ls);
  twNode.textContent = t;
  const w = twNode.getComputedTextLength();
  twCache.set(key, w); return w;
}
const base = (top, lh, fs) => +(top + (lh - 1.2102 * fs) / 2 + 0.9688 * fs).toFixed(2);   // 行框顶部 -> 文字基线（按 Inter 的度量）
const txt = (x, y, s, o = {}) => `<text x="${(+x).toFixed(2)}" y="${y}" font-size="${o.fs || 14}" font-weight="${o.fw || 400}" fill="${o.fill || INK}"` +
  `${o.ls ? ` letter-spacing="${o.ls}"` : ''}${o.anchor ? ` text-anchor="${o.anchor}"` : ''}>${s}</text>`;
const icon = (k, x, y, size, color) => `<svg x="${(+x).toFixed(2)}" y="${y}" width="${size}" height="${size}" viewBox="${ICONS[k].vb}" fill="none" color="${color}">${ICONS[k].inner}</svg>`;
const mix = (hex, a) => '#' + [1, 3, 5].map(i => Math.round(255 - (255 - parseInt(hex.slice(i, i + 2), 16)) * a).toString(16).padStart(2, '0')).join('');
const pctLabel = v => String(+(Math.round(v * 1000 + 1e-7) / 10).toFixed(1)) + '%';   // 20.8% / 16%（整数不带 .0，和 Polymarket 一样）

function timeLabel(ts, step, lang) {
  const d = new Date(ts * 1000), zh = lang === 'zh';
  if (step < 86400) {
    const h = d.getHours() % 12 || 12, mm = String(d.getMinutes()).padStart(2, '0'), am = d.getHours() < 12;
    return `${h}:${mm} ${zh ? (am ? '上午' : '下午') : (am ? 'AM' : 'PM')}`;
  }
  if (step < 86400 * 300) return zh ? `${d.getMonth() + 1}月${d.getDate()}日` : d.toLocaleString('en-US', { month: 'short', day: 'numeric' });
  return zh ? `${d.getFullYear()}年${d.getMonth() + 1}月` : d.toLocaleString('en-US', { month: 'short', year: 'numeric' });
}

function timeTicks(t0, t1) {
  const D = 86400, steps = [1800, 3600, 7200, 10800, 21600, 43200, D, 2 * D, 7 * D, 14 * D, 30 * D, 90 * D, 180 * D, 365 * D];
  const step = steps.find(s => (t1 - t0) / s <= 4) || steps[steps.length - 1];
  const off = -new Date(t0 * 1000).getTimezoneOffset() * 60;   // 对齐到本机时区的整点 / 整天
  const grid = (st) => { const out = []; for (let t = (Math.floor((t0 + off) / st) + 1) * st - off; t <= t1; t += st) out.push(t); return out; };
  return [grid(step), step, grid(step / 4)];   // 带文字的刻度、刻度间隔、细竖线（每格再分 4 份）
}

function yScale(lo, hi) {
  const span = Math.max(hi - lo, .004);
  const step = [.001, .002, .005, .01, .02, .03, .05, .1, .2, .25].find(s => span / s <= 4.5) || .25;
  const y0 = Math.max(0, Math.floor(lo / step + 1e-9) * step);          // 最低一条刻度线就是图的底边
  const y1 = Math.min(1, hi + (hi - y0) * .15);                          // 顶部留一点空
  const ticks = [];
  for (let k = Math.round(y0 / step); k * step <= y1 + 1e-9; k++) ticks.push(k * step);
  return [y0, y1, ticks];
}

// 把挤在一起的标签上下错开：顺序不变，尽量少动
function spread(ys, gap, lo, hi) {
  const order = ys.map((_, i) => i).sort((a, b) => ys[a] - ys[b]), pos = order.map(i => ys[i]);
  for (let it = 0; it < 200; it++) {
    let moved = false;
    for (let k = 1; k < pos.length; k++) {
      const d = gap - (pos[k] - pos[k - 1]);
      if (d > .01) { pos[k - 1] -= d / 2; pos[k] += d / 2; moved = true; }
    }
    if (pos[0] < lo) { pos[0] = lo; moved = true; }
    for (let k = 1; k < pos.length; k++) pos[k] = Math.max(pos[k], pos[k - 1] + gap);
    if (pos[pos.length - 1] > hi) { pos[pos.length - 1] = hi; moved = true; }
    for (let k = pos.length - 2; k >= 0; k--) pos[k] = Math.min(pos[k], pos[k + 1] - gap);
    if (!moved) break;
  }
  const out = []; order.forEach((i, k) => out[i] = pos[k]); return out;
}

let uid = 0;
function avatar(url, name, x, y, size, r, forExport) {
  const href = imgCache.get(url) || (forExport ? null : url);
  if (!href) {
    return `<rect x="${x}" y="${y}" width="${size}" height="${size}" rx="${r}" fill="#f0f1f3"/>` +
      txt(x + size / 2, y + size * .65, esc([...String(name)][0] || '').toUpperCase(), { fs: size * .42, fw: 600, fill: GREY, anchor: 'middle' });
  }
  const id = 'c' + (uid++);
  return `<clipPath id="${id}"><rect x="${x}" y="${y}" width="${size}" height="${size}" rx="${r}"/></clipPath>` +
    `<image href="${esc(href)}" x="${x}" y="${y}" width="${size}" height="${size}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${id})"/>`;
}

// 走势图，坐标以图表容器（922×240）的左上角为原点
function chart(lines, lang, forExport) {
  const top = 10, bottom = 210, left = 34, fs = 13;
  const hasAv = lines.some(s => s.logo);
  const av = 22, ph = 28;                        // 线尾色块里的头像边长、色块高度
  const pillW = s => (hasAv ? 3 + av + 7 : 10) + tw(s.name, fs, 600, -.1) + 5 + tw(pctLabel(s.last), fs, 600, -.1) + 10;
  const right = CW - Math.max(...lines.map(pillW)) - 16;   // 线画到这里，右边是线尾标签列

  const t0 = Math.min(...lines.map(s => s.history[0].t)), t1 = Math.max(...lines.map(s => s.history[s.history.length - 1].t));
  const vals = lines.flatMap(s => s.history.map(p => p.p));
  const [y0, y1, yticks] = yScale(Math.min(...vals), Math.max(...vals));
  const X = t => left + (t - t0) / Math.max(t1 - t0, 1) * (right - left);
  const Y = v => bottom - (v - y0) / (y1 - y0) * (bottom - top);
  const f = n => n.toFixed(1);
  const o = [];

  const [xt, step, minor] = timeTicks(t0, t1);
  for (const t of minor) if (!xt.includes(t))   // 细竖线：点线，避开有文字的刻度
    o.push(`<line x1="${f(X(t))}" y1="${top}" x2="${f(X(t))}" y2="247" stroke="#e7e8eb" stroke-dasharray="1 3"/>`);
  for (const t of xt) o.push(txt(X(t), 224, timeLabel(t, step, lang), { fs: 12, fw: 480, fill: GREY, anchor: 'middle' }));
  for (const v of yticks) {
    o.push(`<line x1="${left}" y1="${f(Y(v))}" x2="${f(right)}" y2="${f(Y(v))}" stroke="#dfe1e4" stroke-dasharray="1 3"/>`);
    o.push(txt(left - 8, f(Y(v) + 4.3), `${+(v * 100).toFixed(1)}%`, { fs: 12, fw: 480, fill: GREY, anchor: 'end' }));
  }
  for (const s of [...lines].reverse()) {         // 名次高的画在上层
    const pts = s.history.map(p => `${f(X(p.t))},${f(Y(p.p))}`).join(' ');
    o.push(`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`);
  }

  // 线尾：圆点（外面两圈淡晕）+ 同色色块，色块里是头像、名字和概率。靠颜色认线，不画连线。
  const ends = lines.map(s => Y(s.history[s.history.length - 1].p));
  const ly = spread(ends, ph + 4, top + ph / 2, bottom - ph / 2);
  lines.forEach((s, i) => {
    const ex = X(s.history[s.history.length - 1].t), ey = ends[i], y = ly[i], c = s.color;
    o.push(`<circle cx="${f(ex)}" cy="${f(ey)}" r="5.5" fill="${mix(c, .32)}"/><circle cx="${f(ex)}" cy="${f(ey)}" r="5" fill="${mix(c, .53)}"/><circle cx="${f(ex)}" cy="${f(ey)}" r="4" fill="${c}"/>`);
    const px = right + 16, ink = lum(c) > .4 ? INK : '#fff';
    o.push(`<rect x="${f(px)}" y="${f(y - ph / 2)}" width="${f(pillW(s))}" height="${ph}" rx="7.2" fill="${c}"/>`);
    let tx = px + 10;
    if (hasAv) { o.push(avatar(s.logo, s.name, +f(px + 3), +f(y - av / 2), av, 4.5, forExport)); tx = px + 3 + av + 7; }
    o.push(`<text x="${f(tx)}" y="${f(y + 4.6)}" font-size="${fs}" font-weight="600" letter-spacing="-.1" fill="${ink}">${esc(s.name)}<tspan dx="5">${pctLabel(s.last)}</tspan></text>`);
  });

  // 左下角的来源标记
  const src = TEXT[lang].src, pw = tw(src, 11, 480) + tw('Polymarket.com', 11, 600) + 13;
  o.push(`<rect x="${left + 4}" y="186" width="${f(pw)}" height="16" rx="4" fill="#f0f1f3"/>`);
  o.push(`<text x="${left + 10.5}" y="197.9" font-size="11" font-weight="480" fill="${GREY}">${src}<tspan font-weight="600">Polymarket.com</tspan></text>`);
  return o.join('');
}

function buildSVG(B, forExport = false) {
  uid = 0;
  const lang = B.lang, L = TEXT[lang], lines = B.lines, o = [];
  const showRows = B.rows && !B.single;
  const H = showRows ? T0 + 438 + 73 * lines.length + 14 : T0 + 426 + 16;

  // 头部：图标、分类、标题、右上角三个按钮
  o.push(avatar(B.image, B.title, X0, T0, 64, 7.2, forExport));
  let cx = X0 + 80;
  B.crumbs.split('·').map(s => s.trim()).filter(Boolean).forEach((c, i) => {
    if (i) { o.push(txt(cx + 4, base(T0 + 4, 24, 16), '·', { fs: 16, fill: GREY })); cx += 4 + 4.5 + 4 + 2; }
    o.push(txt(cx, base(T0 + 6, 20, 14), esc(c), { fs: 14, fw: 540, fill: GREY, ls: -.09 }));
    cx += tw(c, 14, 540, -.09) + 2;
  });
  o.push(txt(X0 + 80, base(T0 + 32, 28, 24), esc(B.title), { fs: 24, fw: 600, ls: -.36 }));
  o.push(icon('code', 835, T0 + 23, 18, INK), icon('link', 875, T0 + 23, 18, INK), icon('bookmark', 915, T0 + 23, 18, INK));

  // 原来放图例的那一行：图例挪到线尾了，这里只留右侧的 Polymarket 水印
  const k = 24 / 168;
  o.push(`<g transform="translate(811.9,${T0 + 82}) scale(${k})" fill="${WM}"><path fill-rule="evenodd" clip-rule="evenodd" d="${LOGO[0]}"/><path d="${LOGO[1]}"/></g>`);

  o.push(`<g transform="translate(${X0},${T0 + 134})">${chart(lines, lang, forExport)}</g>`);

  // 成交量、截止日期、时间范围、右侧两个小图标
  let x = X0;
  if (B.volume) {
    const t = `${money(B.volume)} ${L.vol}`;
    o.push(icon('trophy', x, T0 + 401, 14, INK), txt(x + 20, base(T0 + 398.3, 19.5, 13), t, { fs: 13, fw: 500, ls: -.09 }));
    x += 20 + tw(t, 13, 500, -.09);
  }
  if (B.end) {
    if (B.volume) { o.push(`<rect x="${(x + 10).toFixed(2)}" y="${T0 + 403}" width="1.5" height="10" rx=".75" fill="${RULE}"/>`); x += 21.5; }
    o.push(icon('clock', x, T0 + 402, 12, GREY), txt(x + 18, base(T0 + 398.3, 19.5, 13), B.end, { fs: 13, fw: 500, fill: GREY, ls: -.09 }));
  }
  let rx = 886;
  for (let i = TABS.length - 1; i >= 0; i--) {
    const w = tw(L.tabs[i], 14, 600, -.09);
    o.push(txt(rx - 6 - w, base(T0 + 398, 20, 14), L.tabs[i], { fs: 14, fw: 600, ls: -.09, fill: TABS[i] === B.interval ? INK : GREY }));
    rx -= w + 12;   // 每个按钮左右各 6px 内边距
  }
  o.push(icon('sort', 894, T0 + 401, 18, GREY), icon('gear', 924, T0 + 399, 18, GREY));

  // 选项列表：每行 72 高，行与行之间一条 1px 的线；第一行的"买入 是"是选中状态（实心绿）
  if (showRows) lines.forEach((s, i) => {
    const top = T0 + 439 + 73 * i;
    o.push(`<rect x="${X0}" y="${top - 1}" width="${CW}" height="1" fill="${RULE}"/>`);
    o.push(avatar(s.logo, s.name, X0, top + 16, 40, 7.2, forExport));
    o.push(txt(X0 + 56, base(top + 14, 20, 16), esc(s.name), { fs: 16, fw: 600, ls: -.18 }));
    if (s.volume) {
      const v = `${money(s.volume)} ${L.vol}`;
      o.push(txt(X0 + 56, base(top + 41.5, 13, 13), v, { fs: 13, fw: 490, fill: GREY, ls: -.1 }));
      o.push(icon('gift', X0 + 56 + tw(v, 13, 490, -.1) + 8, top + 40, 16, GREY));
    }
    o.push(txt(481, base(top + 22, 28, 28), s.last < .005 ? '&lt;1%' : pct(s.last), { fs: 28, fw: 600, ls: -.42, anchor: 'middle' }));
    const ask = (s.bestAsk ?? s.last) * 100, no = (1 - (s.bestBid ?? s.last)) * 100;
    const r1 = v => Math.round(v * 10 + 1e-7) / 10, dec = (r1(ask) % 1 || r1(no) % 1) ? 1 : 0;   // 一行里有一个带小数，两个就都带
    [[L.yes, ask, i === 0 ? '#007e26' : '#e0f1e3', i === 0 ? '#fff' : '#007e26', 662], [L.no, no, '#fdebeb', '#df0c10', 806]].forEach(([label, price, bg, fg, bx]) => {
      o.push(`<rect x="${bx}" y="${top + 12}" width="136" height="48" rx="7.2" fill="${bg}"/>`);
      o.push(`<text x="${bx + 68}" y="${(top + 41.5).toFixed(1)}" text-anchor="middle" font-weight="600" fill="${fg}"><tspan font-size="14" letter-spacing="-.09">${label}</tspan><tspan font-size="16" dx="3.9">${r1(price).toFixed(dec)}¢</tspan></text>`);
    });
  });

  const face = forExport ? `<style>@font-face{font-family:PMInter;src:url(data:font/woff2;base64,${INTER}) format("woff2");font-weight:100 900;}</style>` : '';
  return { H, svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style='font-family:${FONT};font-feature-settings:${FEAT};-webkit-font-smoothing:antialiased'>` +
    `${face}<rect width="${W}" height="${H}" fill="#fff"/>${o.join('')}</svg>` };
}

// ───────────────────────── 页面 ─────────────────────────
const state = { data: null, interval: '6h', top: 4, lang: 'zh', rows: true, req: 0 };
const ovKey = () => `pmc:${state.data.slug}:${state.lang}`;
const overrides = () => { try { return JSON.parse(localStorage.getItem(ovKey())) || {}; } catch { return {}; } };
const saveOverrides = o => { try { localStorage.setItem(ovKey(), JSON.stringify(o)); } catch {} };
const lineColor = (i, n) => n === 1 ? COLORS[1] : COLORS[i % COLORS.length];

// 三种反馈：预览上方的状态行、出错时的红色提示条、操作成功后底部的短提示
const say = t => { $('msg').textContent = t || ''; };
const fail = t => { $('err').textContent = t || ''; $('err').hidden = !t; };
let toastTimer;
function toast(t, bad) {
  const el = $('toast'); el.textContent = t; el.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.className = ''; }, bad ? 7000 : 2600);
}
function setBusy(b) {
  document.body.classList.toggle('busy', b); $('stage').classList.toggle('busy', b);
  $('go').disabled = b; $('go').textContent = b ? '生成中…' : '生成';
}
function flash(btn, text) {   // 按钮上的字短暂换成"已复制"之类
  const span = btn.querySelector('span'); btn.dataset.label = btn.dataset.label || span.textContent;
  span.textContent = text; clearTimeout(btn._t); btn._t = setTimeout(() => { span.textContent = btn.dataset.label; }, 1600);
}

function bundle() {   // 抓到的数据 + 你改过的文字 -> 画图用的数据
  const d = state.data, ov = overrides();
  const lines = d.lines.map((s, i) => ({ ...s, name: (ov.names || {})[s.key] || s.name,
    color: lineColor(i, d.lines.length), last: s.history[s.history.length - 1].p }));
  return { ...d, lines, title: ov.title || d.title, crumbs: ov.crumbs || d.crumbs, lang: state.lang, rows: state.rows };
}

function render() {
  if (!state.data) return;
  const { svg, H } = buildSVG(bundle());
  $('stage').innerHTML = `<div class="shot">${svg}</div>`;
  $('dims').textContent = `${W * 2} × ${H * 2} px`;
  $('copy').disabled = $('save').disabled = false;
}

const hasOverrides = o => !!(o.title || o.crumbs || Object.values(o.names || {}).some(Boolean));
function fillTexts() {
  const d = state.data, ov = overrides(), box = $('texts');
  box.innerHTML = '';
  const row = (label, value, placeholder, set, dot) => {
    const w = document.createElement('label'); w.className = 'field';
    const s = document.createElement('span');
    if (dot) { const c = document.createElement('i'); c.style.background = dot; s.append(c); }
    s.append(label);
    const i = document.createElement('input'); i.type = 'text'; i.value = value || ''; i.placeholder = placeholder; i.spellcheck = false;
    i.oninput = () => { const o = overrides(); set(o, i.value.trim()); saveOverrides(o); render(); $('reset').hidden = !hasOverrides(o); };
    w.append(s, i); box.append(w);
  };
  row('标题', ov.title, d.title, (o, v) => o.title = v);
  row('分类', ov.crumbs, d.crumbs, (o, v) => o.crumbs = v);
  d.lines.forEach((s, i) => row(`选项 ${i + 1}`, (ov.names || {})[s.key], s.name,
    (o, v) => { (o.names = o.names || {})[s.key] = v; }, lineColor(i, d.lines.length)));
  $('reset').hidden = !hasOverrides(ov);
  $('textsHint').textContent = '原站的分类是"大类 · 标签"（如 Finance · NVDA），接口只给标签，大类要在这里补。改动按市场记在这个浏览器里。';
}
$('reset').onclick = () => { try { localStorage.removeItem(ovKey()); } catch {} fillTexts(); render(); };

// 最近生成过的市场，点一下重新生成
const recents = () => { try { return JSON.parse(localStorage.getItem('pmc:recent')) || []; } catch { return []; } };
function drawRecent() {
  const list = recents(), box = $('recent');
  box.innerHTML = ''; $('recentBox').hidden = !list.length;
  list.forEach(r => {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.link = r.link;
    b.textContent = b.title = r.title || r.slug; box.append(b);
  });
}
function remember(link, slug, title) {
  try { localStorage.setItem('pmc:recent', JSON.stringify([{ link, slug, title }, ...recents().filter(r => r.slug !== slug)].slice(0, 6))); } catch {}
  drawRecent();
}
$('clearRecent').onclick = () => { try { localStorage.removeItem('pmc:recent'); } catch {} drawRecent(); };

const persist = () => { try { localStorage.setItem('pmc:last', JSON.stringify({ link: $('link').value.trim(), interval: state.interval, top: state.top, lang: state.lang, rows: state.rows })); } catch {} };

async function load() {
  const link = $('link').value.trim();
  if (!link) return;
  const my = ++state.req, stale = () => my !== state.req;   // 连点几次时，只认最后一次
  setBusy(true); fail(''); say('正在从 Polymarket 取数据…');
  try {
    await fontReady;
    const [slug, marketSlug] = parseSlug(link);
    const ev = await fetchEvent(slug, marketSlug, state.lang);
    if (stale()) return;
    let { lines, single } = buildLines(ev, slug ? marketSlug : null);
    lines = lines.slice(0, state.top);
    await Promise.all(lines.map(async s => { s.history = await fetchHistory(s.token, state.interval); }));
    if (stale()) return;
    const skipped = lines.filter(s => s.history.length < 2).length;
    lines = lines.filter(s => s.history.length >= 2);
    if (!lines.length) throw new Error('这个市场在所选时间范围内没有价格历史，换个时间范围试试（比如"全部"）。');
    let end = '';
    try { end = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date(ev.endDate)); } catch {}  // Polymarket 按美东时间显示
    state.data = { slug: slug || marketSlug, title: ev.title || '', image: ev.image || ev.icon,
      // 原站是"大类 · 主标签"（如 Finance · NVDA），但接口只给得出主标签，大类要在"修改文字"里自己补
      crumbs: ((ev.tags || []).map(t => t.label).filter(Boolean)[0]) || 'Polymarket',
      volume: num(ev.volume), end, interval: state.interval, single, lines };
    fillTexts(); render();
    const last = new Date(Math.max(...lines.map(s => s.history[s.history.length - 1].t)) * 1000);
    say(`数据更新到 ${last.toLocaleString('zh-CN', { hour12: false })}` + (skipped ? `；有 ${skipped} 个选项在这段时间没有价格历史，没画` : ''));
    persist(); remember(link, state.data.slug, state.data.title);
    // 头像转成可导出的格式，转好后重画一次
    Promise.all([state.data.image, ...lines.map(s => s.logo)].map(inlineImage)).then(() => { if (!stale()) render(); });
  } catch (e) { if (!stale()) { fail(e.message || String(e)); say(''); } }
  if (!stale()) setBusy(false);
}

async function toPNG() {
  await Promise.all([state.data.image, ...state.data.lines.map(s => s.logo)].map(inlineImage));
  const { svg, H } = buildSVG(bundle(), true), img = new Image();
  await new Promise((ok, no) => { img.onload = ok; img.onerror = () => no(new Error('导出失败')); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
  const c = document.createElement('canvas'); c.width = W * 2; c.height = H * 2;   // 2 倍清晰度
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0, c.width, c.height);
  await new Promise(r => setTimeout(r, 120));   // 内嵌字体第一次可能还没就绪，等一下再画一遍
  g.clearRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/png'));
  const missing = [state.data.image, ...state.data.lines.map(s => s.logo)].filter(u => u && !imgCache.get(u)).length;
  return { blob, missing };
}
const note = missing => missing ? `（有 ${missing} 张头像读取失败，图里用灰色占位。想要完整头像可以直接对着页面截图）` : '';

$('save').onclick = async () => {
  try {
    const { blob, missing } = await toPNG(), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `${state.data.slug}-${state.interval}.png`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    flash($('save'), '已下载'); toast('已下载 PNG' + note(missing), !!missing);
  } catch (e) { toast(e.message || '导出失败', true); }
};
$('copy').onclick = async () => {
  try {
    const p = toPNG();   // 剪贴板要求在点击里立刻发起，所以把"还没出来的图"直接交给它
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': p.then(r => r.blob) })]);
    const { missing } = await p;
    flash($('copy'), '已复制'); toast('已复制到剪贴板，可以直接粘贴到推文里' + note(missing), !!missing);
  } catch (e) { toast('这个浏览器不允许复制图片，请用"下载 PNG"。', true); }
};

// 控件
function seg(id, items, set) {
  items.forEach(([k, label]) => {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.k = k; b.textContent = label;
    b.onclick = () => { if (b.getAttribute('aria-pressed') === 'true') return; set(k); syncControls(); persist(); load(); };
    $(id).append(b);
  });
}
seg('interval', TABS.map((k, i) => [k, TEXT.zh.tabs[i]]), k => { state.interval = k; });
seg('top', [1, 2, 3, 4, 5, 6, 7, 8].map(n => [String(n), n]), k => { state.top = +k; });
seg('lang', [['zh', '中文'], ['en', 'English']], k => { state.lang = k; });
function syncControls() {
  [['interval', state.interval], ['top', String(state.top)], ['lang', state.lang]].forEach(([id, v]) =>
    [...$(id).children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === v))));
  $('rows').checked = state.rows;
}
$('rows').onchange = () => { state.rows = $('rows').checked; persist(); render(); };

// 链接输入：回车或点"生成"；粘贴后自动生成；在页面空白处粘贴 Polymarket 链接也行
const syncClear = () => { $('clear').hidden = !$('link').value; };
$('form').onsubmit = e => { e.preventDefault(); if (!$('link').value.trim()) $('link').focus(); else load(); };
$('link').oninput = syncClear;
$('link').addEventListener('paste', () => setTimeout(() => { syncClear(); load(); }, 0));
$('clear').onclick = () => { $('link').value = ''; syncClear(); $('link').focus(); };
document.addEventListener('paste', e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const t = (e.clipboardData.getData('text') || '').trim();
  if (/polymarket\.com\//i.test(t)) { $('link').value = t; syncClear(); load(); }
});
document.addEventListener('click', e => {   // 示例和"最近生成"里的条目
  const b = e.target.closest('[data-link]'); if (!b) return;
  $('link').value = b.dataset.link; syncClear(); load();
});

// 启动：地址栏参数优先（?url=…&interval=1w&top=4&lang=zh&rows=0），否则恢复上次的设置
(function init() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('pmc:last')) || {}; } catch {}
  const q = new URLSearchParams(location.search);
  const link = q.get('url') || saved.link || '';
  state.interval = TABS.includes(q.get('interval')) ? q.get('interval') : (saved.interval || '6h');
  state.top = Math.min(8, Math.max(1, +(q.get('top') || saved.top || 4)));
  state.lang = ['zh', 'en'].includes(q.get('lang')) ? q.get('lang') : (saved.lang || 'zh');
  state.rows = q.has('rows') ? q.get('rows') !== '0' : saved.rows !== false;
  syncControls(); drawRecent();
  $('link').value = link; syncClear();
  if (link) load();
})();
</script>
</body>
